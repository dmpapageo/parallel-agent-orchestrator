# Egress allowlist proxy for the orchestrator container.
# The ONLY host anything inside may reach is api.anthropic.com over HTTPS.
#
# This is unchanged from the single-agent project, and that is the point: N
# parallel sub-agents share ONE egress boundary, so adding agents does not widen
# the network surface at all.

# Agents use HTTPS, which a proxy sees as a CONNECT tunnel.
acl CONNECT method CONNECT
acl SSL_ports port 443

# The one and only allowed destination.
acl allowed_domains dstdomain api.anthropic.com

# Refuse tunnels to anything except port 443.
http_access deny CONNECT !SSL_ports

# Allow the allowlisted domain; deny everything else.
http_access allow allowed_domains
http_access deny all

# Listen on 3128 (the container points HTTPS_PROXY here).
http_port 3128

# Resolve via Docker's embedded DNS. The proxy sits on egress_net, so it can
# forward external lookups to the internet.
dns_nameservers 127.0.0.11

# Writable dir the image provisions — keeps squid quiet at startup.
coredump_dir /var/spool/squid
